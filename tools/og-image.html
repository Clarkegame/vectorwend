<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:627px;overflow:hidden;font-family:"DejaVu Sans",system-ui,sans-serif;
 background:radial-gradient(circle at 80% 20%,#1b7f74 0%,#0f4c4a 55%,#0a3634 100%);color:#fff;position:relative}
.grid{position:absolute;inset:0;opacity:.07;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:40px 40px}
.left{position:absolute;left:64px;top:70px;width:660px}
h1{font-size:92px;font-weight:900;letter-spacing:1px;line-height:1}
h1 span{color:#8cc63f}
.sub{font-size:31px;margin-top:20px;opacity:.95;line-height:1.3}
.sched{margin-top:34px;display:inline-block;background:rgba(255,255,255,.13);border:2px solid rgba(255,255,255,.3);padding:12px 22px;border-radius:12px;font-size:26px;font-weight:700}
.how{margin-top:22px;font-size:22px;opacity:.8}
.board{position:absolute;left:750px;top:113px;width:400px;height:400px}
.board svg{position:absolute;inset:0;width:400px;height:400px}
.tiles{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,72px);gap:10px}
.t{width:72px;height:72px;border-radius:14px;background:#f4f8f6;border:3px solid #cfdcd8;color:#123330;display:grid;place-items:center;font-size:40px;font-weight:900}
.t.wall{background:repeating-linear-gradient(45deg,#8fa3a0,#8fa3a0 7px,#829794 7px,#829794 14px);border-color:#829794}
.mz{position:absolute;left:430px;top:385px;width:250px;height:250px;transform:rotate(-10deg)}
.trail{position:absolute;left:560px;top:300px}
</style></head><body><div class="grid"></div>
<div class="left">
 <h1>Vector<span>Wend</span></h1>

</div>
